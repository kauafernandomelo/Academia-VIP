services:
  - type: web
    name: academia-vip
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && python init_db.py && gunicorn wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FLASK_APP
        value: "app.py"
