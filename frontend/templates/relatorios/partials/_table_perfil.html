{% for p in perfil.lista %}
<tr>
    <td><strong>{{ p.aluno }}</strong></td>
    <td>
        <span class="badge bg-{{ 'success' if p.dias_medio <= 0 else 'warning' if p.dias_medio <= 3 else 'danger' }}">
            {{ p.dias_medio }} dia{{ 's' if p.dias_medio != 1 }}
        </span>
    </td>
    <td>{{ p.tendencia }}</td>
    <td>{{ p.total_pagamentos }}</td>
</tr>
{% endfor %}
