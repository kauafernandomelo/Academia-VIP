{% for p in fat.lista %}
<tr>
    <td>{{ p.data_pagamento.strftime('%d/%m/%Y') }}</td>
    <td><strong>{{ p.mensalidade.matricula.aluno.nome }}</strong></td>
    <td>{{ p.mensalidade.matricula.plano.nome }}</td>
    <td class="text-success fw-bold">R$ {{ "%.2f"|format(p.valor_pago) }}</td>
    <td><span class="badge bg-light text-dark">{{ p.forma_pagamento.replace('_', ' ').title() }}</span></td>
</tr>
{% else %}
<tr><td colspan="5" class="text-center py-4 text-muted"><i class="bi bi-inbox d-block mb-1"></i>Nenhum pagamento neste mes.</td></tr>
{% endfor %}
