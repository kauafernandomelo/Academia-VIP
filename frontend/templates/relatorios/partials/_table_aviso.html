{% for m in aviso.lista %}
<tr class="table-warning">
    <td><strong>{{ m.matricula.aluno.nome }}</strong></td>
    <td>{{ m.matricula.plano.nome }}</td>
    <td>R$ {{ "%.2f"|format(m.valor) }}</td>
    <td>{{ m.data_vencimento.strftime('%d/%m/%Y') }}</td>
    <td><span class="badge bg-warning text-dark">{{ (m.data_vencimento - hoje).days }} dias</span></td>
</tr>
{% endfor %}
