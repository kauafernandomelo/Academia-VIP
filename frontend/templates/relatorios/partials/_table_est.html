{% for e in est.lista %}
<tr>
    <td><strong>{{ e.aluno }}</strong></td>
    <td>{{ e.plano }}</td>
    <td class="text-info fw-bold">R$ {{ "%.2f"|format(e.valor) }}</td>
    <td>{{ e.vencimento.strftime('%d/%m/%Y') }}</td>
    <td><span class="badge bg-{{ 'info' if e.status == 'estimado' else 'warning' }}">{{ 'Estimado' if e.status == 'estimado' else 'Pendente' }}</span></td>
</tr>
{% else %}
<tr><td colspan="5" class="text-center py-4 text-muted"><i class="bi bi-inbox d-block mb-1"></i>Nenhuma estimativa.</td></tr>
{% endfor %}
