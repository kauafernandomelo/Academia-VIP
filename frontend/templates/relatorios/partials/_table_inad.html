{% for m in inad.lista %}
<tr>
    <td><strong>{{ m.matricula.aluno.nome }}</strong></td>
    <td>{{ m.matricula.plano.nome }}</td>
    <td class="text-danger fw-bold">R$ {{ "%.2f"|format(m.valor) }}</td>
    <td>{{ m.data_vencimento.strftime('%d/%m/%Y') }}</td>
    <td><span class="badge bg-danger">{{ (hoje - m.data_vencimento).days }} dias</span></td>
</tr>
{% else %}
<tr><td colspan="5" class="text-center py-4 text-success"><i class="bi bi-check-circle-fill d-block mb-1 fs-3"></i>Nenhuma inadimplencia! Parabens!</td></tr>
{% endfor %}
