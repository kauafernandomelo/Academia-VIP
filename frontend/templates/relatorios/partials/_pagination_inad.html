{% if inad.pages > 1 %}
<div class="card-footer border-0 bg-transparent pt-0">
    <nav class="d-flex justify-content-between align-items-center">
        <small class="text-muted">Mostrando {{ ((inad.page-1)*10)+1 }}-{{ [inad.page*10, inad.total]|min }} de {{ inad.total }}</small>
        <ul class="pagination pagination-sm mb-0">
            {% for p in range(1, inad.pages + 1) %}
            <li class="page-item {{ 'active' if p == inad.page }}">
                <a class="page-link ajax-page" 
                   href="?q={{ q }}&section=inad&page_fat={{ request.args.get('page_fat',1) }}&page_inad={{ p }}&page_est={{ request.args.get('page_est',1) }}&page_aviso={{ request.args.get('page_aviso',1) }}&page_perfil={{ request.args.get('page_perfil',1) }}"
                   data-target="tbody-inad" data-pagination="pagination-inad" data-section="inad">
                   {{ p }}
                </a>
            </li>
            {% endfor %}
        </ul>
    </nav>
</div>
{% endif %}
