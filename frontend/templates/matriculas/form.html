{% extends "base.html" %}

{% block titulo %}Nova Matricula - Academia VIP{% endblock %}

{% block conteudo %}
<h2 class="mb-4">
    <i class="bi bi-clipboard-plus"></i> Nova Matricula
</h2>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Aluno *</label>
                    <select name="aluno_id" class="form-select" required>
                        <option value="">Selecione um aluno</option>
                        {% for aluno in alunos %}
                        <option value="{{ aluno.id }}">{{ aluno.nome }} - {{ aluno.cpf }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Plano *</label>
                    <select name="plano_id" class="form-select" required>
                        <option value="">Selecione um plano</option>
                        {% for plano in planos %}
                        <option value="{{ plano.id }}">{{ plano.nome }} - R$ {{ "%.2f"|format(plano.valor) }}/{{ plano.duracao_meses }}m</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="row g-3">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Data de Inicio *</label>
                    <input type="date" name="data_inicio" class="form-control" 
                           value="{{ hoje }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Forma de Pagamento *</label>
                    <select name="forma_pagamento" class="form-select" required>
                        <option value="">Selecione...</option>
                        <option value="pix">PIX</option>
                        <option value="dinheiro">Dinheiro</option>
                        <option value="cartao_credito">Cartao de Credito</option>
                        <option value="cartao_debito">Cartao de Debito</option>
                        <option value="boleto">Boleto</option>
                    </select>
                    <small class="text-muted">O valor integral do plano sera pago no ato da matricula.</small>
                </div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success">
                    <i class="bi bi-check-lg"></i> Matricular
                </button>
                <a href="{{ url_for('matriculas.listar') }}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Voltar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
